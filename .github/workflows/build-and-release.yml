name: Build and publish platform packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.7)"
        required: true
        type: string
      publish:
        description: "Upload assets to the GitHub release"
        required: false
        default: true
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

# App sources live in separate NOVA snapshot repositories and are cloned into
# reference/<name> so their Cargo path dependency on ../../../../win7-compat
# resolves inside this checkout.
jobs:
  windows-arm64:
    name: Windows (win-arm64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone app sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repos = @{ 'wordcraft' = 'novawrite'; 'gridcraft' = 'novagrid'; 'deckcraft' = 'novadeck'; 'pdfcraft' = 'novapdf' }
          foreach ($name in $repos.Keys) {
            git clone --depth 1 "https://github.com/${{ github.repository_owner }}/nova-$name.git" "reference/$name"
            if ($LASTEXITCODE -ne 0) { throw "clone failed: $name" }
          }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Install NASM
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build NOVA apps
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:LIB = ''
          $env:RUSTFLAGS = '-C target-feature=+crt-static'
          $apps = @(
            @{ repo='reference/wordcraft'; pkg='novawrite'; bin='novawrite.exe' },
            @{ repo='reference/gridcraft';  pkg='novagrid';  bin='novagrid.exe'  },
            @{ repo='reference/deckcraft'; pkg='novadeck';  bin='novadeck.exe'  },
            @{ repo='reference/pdfcraft';  pkg='novapdf';   bin='novapdf.exe'   }
          )
          foreach ($a in $apps) {
            cargo build --release --manifest-path "$($a.repo)/Cargo.toml" --target aarch64-pc-windows-msvc -p $a.pkg
            if ($LASTEXITCODE -ne 0) { throw "build failed: $($a.pkg)" }
          }

      - name: Assemble package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = "publish/NOVAWorkspace-win-arm64"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          foreach ($b in @('novawrite.exe','novagrid.exe','novadeck.exe','novapdf.exe')) {
            $found = Get-ChildItem "reference" -Recurse -File -Filter $b | Where-Object { $_.FullName -like "*\target\aarch64-pc-windows-msvc\release\*" } | Select-Object -First 1
            if (-not $found) { throw "Missing $b" }
            Copy-Item $found.FullName (Join-Path $out $b) -Force
          }
          @(
            'NOVA Workspace (Windows ARM64 build)',
            '- Includes NOVA Write/Grid/Deck/PDF binaries for Windows on ARM (Windows 11 ARM64).',
            '- NOVA Desk (Windows launcher) is not included in this package.',
            '- Run the app executables directly.'
          ) | Set-Content -Path (Join-Path $out 'README.txt') -Encoding UTF8
          Compress-Archive -Path (Join-Path $out '*') -DestinationPath "publish/NOVAWorkspace-win-arm64.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: NOVAWorkspace-win-arm64
          path: publish/NOVAWorkspace-win-arm64.zip

      - name: Publish release asset
        if: ${{ inputs.publish || startsWith(github.ref, 'refs/tags/') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ inputs.tag }}'
          if (-not $tag -and '${{ github.ref_type }}' -eq 'tag') { $tag = '${{ github.ref_name }}' }
          if (-not $tag) { throw 'No release tag provided' }
          gh release view $tag --repo ${{ github.repository }} *> $null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --repo ${{ github.repository }} --title "NOVA Workspace $tag" --notes "Platform builds" }
          gh release upload $tag "publish/NOVAWorkspace-win-arm64.zip" --repo ${{ github.repository }} --clobber

  linux:
    name: Ubuntu x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone app sources
        run: |
          set -euo pipefail
          for name in wordcraft gridcraft deckcraft pdfcraft; do
            git clone --depth 1 "https://github.com/${{ github.repository_owner }}/nova-$name.git" "reference/$name"
          done

      - uses: dtolnay/rust-toolchain@stable

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev libssl-dev nasm cmake clang \
            libfontconfig1-dev libfreetype6-dev libasound2-dev libudev-dev libwayland-dev \
            libxrandr-dev libxi-dev libxcursor-dev libgl1-mesa-dev libegl1-mesa-dev zip

      - name: Build NOVA apps
        run: |
          set -euo pipefail
          for spec in "reference/wordcraft:novawrite" "reference/gridcraft:novagrid" "reference/deckcraft:novadeck" "reference/pdfcraft:novapdf"; do
            IFS=: read -r repo pkg <<< "$spec"
            cargo build --release --manifest-path "$repo/Cargo.toml" -p "$pkg"
          done

      - name: Assemble package
        run: |
          set -euo pipefail
          out="publish/NOVAWorkspace-ubuntu"
          mkdir -p "$out"
          for bin in novawrite novagrid novadeck novapdf; do
            src=$(find reference -path "*/target/release/$bin" | head -n 1)
            test -n "$src"
            cp "$src" "$out/$bin"
            chmod +x "$out/$bin"
          done
          cat > "$out/README.txt" <<'EOF'
          NOVA Workspace (Ubuntu/Linux x64 build)
          - Includes NOVA Write, Grid, Deck and PDF binaries.
          - NOVA Desk (Windows launcher) is not included on Linux.
          - Requires a desktop session with OpenGL and the usual GTK3/X11 runtime libraries.
          - Run: ./novawrite | ./novagrid | ./novadeck | ./novapdf
          EOF
          (cd publish && zip -r NOVAWorkspace-ubuntu.zip NOVAWorkspace-ubuntu)

      - uses: actions/upload-artifact@v4
        with:
          name: NOVAWorkspace-ubuntu
          path: publish/NOVAWorkspace-ubuntu.zip

      - name: Publish release asset
        if: ${{ inputs.publish || startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ] && [ "${{ github.ref_type }}" = "tag" ]; then tag="${{ github.ref_name }}"; fi
          test -n "$tag"
          gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1 || gh release create "$tag" --repo "${{ github.repository }}" --title "NOVA Workspace $tag" --notes "Platform builds"
          gh release upload "$tag" "publish/NOVAWorkspace-ubuntu.zip" --repo "${{ github.repository }}" --clobber

  macos:
    name: macOS (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            asset_base: NOVAWorkspace-macos-intel
          - platform: macos-apple-silicon
            runner: macos-15
            target: aarch64-apple-darwin
            asset_base: NOVAWorkspace-macos-apple-silicon
    steps:
      - uses: actions/checkout@v4

      - name: Clone app sources
        run: |
          set -euo pipefail
          for name in wordcraft gridcraft deckcraft pdfcraft; do
            git clone --depth 1 "https://github.com/${{ github.repository_owner }}/nova-$name.git" "reference/$name"
          done

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install deps
        run: brew install nasm

      - name: Build NOVA apps
        run: |
          set -euo pipefail
          for spec in "reference/wordcraft:novawrite" "reference/gridcraft:novagrid" "reference/deckcraft:novadeck" "reference/pdfcraft:novapdf"; do
            IFS=: read -r repo pkg <<< "$spec"
            cargo build --release --manifest-path "$repo/Cargo.toml" -p "$pkg" --target "${{ matrix.target }}"
          done

      - name: Assemble package
        run: |
          set -euo pipefail
          out="publish/${{ matrix.asset_base }}"
          mkdir -p "$out"
          for bin in novawrite novagrid novadeck novapdf; do
            src=$(find reference -path "*/target/${{ matrix.target }}/release/$bin" | head -n 1)
            test -n "$src"
            cp "$src" "$out/$bin"
            chmod +x "$out/$bin"
          done
          cat > "$out/README.txt" <<'EOF'
          NOVA Workspace (macOS build)
          - Includes NOVA Write, Grid, Deck and PDF binaries.
          - NOVA Desk (Windows launcher) is not included on macOS.
          - This build is unsigned and unnotarized. If Gatekeeper blocks it, run:
              xattr -dr com.apple.quarantine <folder>
            or right-click the app binary and choose Open.
          EOF
          (cd publish && zip -r "${{ matrix.asset_base }}.zip" "${{ matrix.asset_base }}")

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_base }}
          path: publish/${{ matrix.asset_base }}.zip

      - name: Publish release asset
        if: ${{ inputs.publish || startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ] && [ "${{ github.ref_type }}" = "tag" ]; then tag="${{ github.ref_name }}"; fi
          test -n "$tag"
          gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1 || gh release create "$tag" --repo "${{ github.repository }}" --title "NOVA Workspace $tag" --notes "Platform builds"
          gh release upload "$tag" "publish/${{ matrix.asset_base }}.zip" --repo "${{ github.repository }}" --clobber
